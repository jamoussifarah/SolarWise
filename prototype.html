<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Prototype : SolarWise Concept</title>
    <style>
        :root { --primary: #f59e0b; --bg: #f8fafc; --card: #ffffff; }
        body { font-family: sans-serif; background: var(--bg); padding: 20px; }
        header { text-align: center; border-bottom: 2px solid var(--primary); margin-bottom: 30px; }
        .container { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; max-width: 900px; margin: auto; }
        .section { background: var(--card); padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h2 { color: var(--primary); margin-top: 0; }
        input { width: 100%; padding: 8px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; }
        button { background: var(--primary); color: white; border: none; padding: 10px; width: 100%; border-radius: 4px; cursor: pointer; }
        .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        .stat-box { background: #fffbeb; padding: 10px; text-align: center; border-radius: 5px; border: 1px solid #fde68a; }
        .placeholder-chart { height: 100px; background: #eee; border: 2px dashed #ccc; margin-top: 15px; display: flex; align-items: center; justify-content: center; }
        .ai-box { margin-top: 15px; padding: 10px; background: #f0fdf4; border-left: 4px solid #22c55e; }
    </style>
</head>
<body>
    <header>
        <h1>SolarWise Prototype</h1>
        <p>Maquette de structure initiale</p>
    </header>
    <div class="container">
        <div class="section">
            <h2>1. Entrées</h2>
            <input type="text" placeholder="Ville">
            <input type="number" placeholder="kWh/mois">
            <input type="number" placeholder="Budget ($)">
            <input type="number" placeholder="Surface (m²)">
            <button>Simuler</button>
        </div>
        <div class="section">
            <h2>2. Résultats</h2>
            <div class="stats">
                <div class="stat-box"><strong>5.2 kW</strong><br>Taille</div>
                <div class="stat-box"><strong>4800 $</strong><br>Coût</div>
            </div>
            <div class="placeholder-chart">[ Zone du Graphique ]</div>
            <div class="ai-box"><strong>IA :</strong> "Conseil d'optimisation ici..."</div>
        </div>
    </div>
</body>
</html>
